<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 600px;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        p {
            font-size: 11px;
            line-height: 1.8;
            color: #999;
            margin-bottom: 30px;
        }

        a {
            color: #fff;
            text-decoration: none;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid #333;
            padding: 10px 20px;
            display: inline-block;
            transition: background 0.3s;
        }

        a:hover {
            background: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <p>The page you're looking for<br>doesn't exist.</p>
        <a href="/gallery">Back to gallery</a>
    </div>
</body>
</html>
